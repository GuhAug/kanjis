<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nihongo Progressive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>(function(){var t=localStorage.getItem('nihongo_theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nihongo">
  <meta name="theme-color" content="#121228">
</head>
<body>
  <!-- Sidebar (desktop) -->
  <nav id="sidebar" class="sidebar"></nav>

  <!-- Top bar (mobile) -->
  <header id="top-bar" class="top-bar"></header>

  <!-- Main content -->
  <div class="layout">
    <main id="app" class="app-main">
      <div class="loading-screen">
        <div class="loading-kanji">漢</div>
        <p>Carregando...</p>
      </div>
    </main>
  </div>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Modal overlay -->
  <div id="modal-overlay" class="modal-overlay hidden"></div>

  <!-- Scripts — order matters (no ES modules for file:// compat) -->
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <script src="data/kanji.js"></script>
  <script src="data/grammar.js"></script>
  <script src="data/particles.js"></script>
  <script src="data/transitivity.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/navbar.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/browse.js"></script>
  <script src="js/views/card.js"></script>
  <script src="js/views/flashcard.js"></script>
  <script src="js/views/quiz.js"></script>
  <script src="js/views/theory.js"></script>
  <script src="js/views/grammar.js"></script>
  <script src="js/views/particles.js"></script>
  <script src="js/views/transitivity.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
